<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PulseIQ</title>

    <link rel="stylesheet" href="intro.css">
</head>

<body>

    <div class="intro-container">

        <!-- Background -->
        <div class="background"></div>

        <!-- Planet -->
        <div class="planet">

            <div class="sphere"></div>

            <div class="orbit-ring"></div>

            <!-- Categories -->
            <div class="categories">

                <div class="category ai">AI</div>
                <div class="category business">Business</div>
                <div class="category sports">Sports</div>
                <div class="category politics">Politics</div>
                <div class="category technology">Technology</div>
                <div class="category health">Health</div>
                <div class="category science">Science</div>
                <div class="category space">Space</div>

            </div>

        </div>

        <!-- Logo -->
        <div class="logo">

            <span class="letter p">P</span>
            <span class="letter u">u</span>
            <span class="letter l">l</span>
            <span class="letter s">s</span>
            <span class="letter e">e</span>
            <span class="letter i">I</span>
            <span class="letter q">Q</span>

        </div>

        <!-- Tagline -->
        <p class="tagline">
            Read News Smartly
        </p>

    </div>

    <script src="intro.js"></script>

</body>
</html>
